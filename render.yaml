services:
  - type: web
    name: gitflow-api
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gitflow-db
          property: connectionString
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GITHUB_TOKEN_ENCRYPTION_KEY
        sync: false

  - type: worker
    name: gitflow-polling-worker
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m app.workers.polling"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gitflow-db
          property: connectionString
      - key: MAX_CONCURRENT_SCANS
        value: 2
      - key: POLL_INTERVAL_SECONDS
        value: 300
      - key: GITHUB_TOKEN_ENCRYPTION_KEY
        sync: false

databases:
  - name: gitflow-db
    plan: free
